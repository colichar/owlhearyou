name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PortAudio
        run: sudo apt-get install -y libportaudio2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[client,server,dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v

  e2e-whisper:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    env:
      STT_BACKEND: whisper
      STT_DEVICE: cpu
      WHISPER_MODEL: base

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[client,server,whisper,dev]"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Run E2E tests
        run: pytest tests/e2e/ -v

  e2e-nemotron:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    env:
      STT_BACKEND: nemotron
      STT_DEVICE: cpu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[client,server,nemotron,dev]"

      - name: Cache Nemotron model
        uses: actions/cache@v4
        with:
          path: models/nemotron
          key: nemotron-${{ hashFiles('src/transcriber.py') }}

      - name: Run E2E tests
        run: pytest tests/e2e/ -v
