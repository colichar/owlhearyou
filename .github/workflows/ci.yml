name: CI

on:
  push:
    branches: [main]
    tags: ['nemotron-kokoro-*', 'whisper-kokoro-*', 'owl-*']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PortAudio
        run: sudo apt-get install -y libportaudio2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[client,server,dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v

  e2e-whisper:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    env:
      STT_BACKEND: whisper
      STT_DEVICE: cpu
      WHISPER_MODEL: base

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[client,server,whisper,dev]"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Run E2E tests
        run: pytest tests/e2e/ -v

  e2e-nemotron:
    runs-on: ubuntu-latest
    needs: [unit-tests]

    env:
      STT_BACKEND: nemotron
      STT_DEVICE: cpu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[client,server,nemotron,dev]"

      - name: Cache Nemotron model
        uses: actions/cache@v4
        with:
          path: models/nemotron
          key: nemotron-${{ hashFiles('src/transcriber.py') }}

      - name: Run E2E tests
        run: pytest tests/e2e/ -v

  publish:
    runs-on: ubuntu-latest
    needs: [e2e-nemotron, e2e-whisper]
    if: startsWith(github.ref, 'refs/tags/nemotron-kokoro-') || startsWith(github.ref, 'refs/tags/whisper-kokoro-')

    steps:
      - uses: actions/checkout@v4

      - name: Extract target from tag
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          TARGET=$(echo "$TAG" | sed 's/-[0-9].*//')
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "image=colicharis/owlhearyou:$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ steps.meta.outputs.target }}
          push: true
          tags: ${{ steps.meta.outputs.image }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [e2e-nemotron, e2e-whisper]
    if: startsWith(github.ref, 'refs/tags/owl-')
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
