[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "owlhearyou"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
client  = ["websockets>=16.0", "sounddevice>=0.5.5", "numpy>=2.4.2"]
server  = ["fastapi>=0.129.0", "uvicorn>=0.40.0", "numpy>=2.4.2", "huggingface-hub>=1.15.0"]
whisper  = ["faster-whisper>=1.2.1"]
nemotron = ["sherpa-onnx>=1.12.24"]
dev     = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
