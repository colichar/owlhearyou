[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "owlhearyou"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "sounddevice",
    "numpy",
    "huggingface-hub",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
whisper = ["faster-whisper"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
